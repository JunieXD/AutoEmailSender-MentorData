<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>投稿审核 · AutoEmailSender 社区导师库</title>
    <link rel="stylesheet" href="styles.css?v=6" />
  </head>
  <body class="review-page">
    <a class="skip-link" href="#review-workspace">跳到审核内容</a>
    <main class="shell review-shell">
      <header class="review-hero">
        <a class="back-link" href="./">← 返回社区导师库</a>
        <h1>审核导师投稿</h1>
      </header>

      <section id="review-status" class="review-status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <div>
          <strong id="status-title">读取中…</strong>
          <p id="status-detail">正在核对投稿。</p>
        </div>
      </section>

      <section id="review-summary" class="review-summary" hidden>
        <div>
          <span class="label">Issue</span>
          <strong id="review-issue">—</strong>
        </div>
        <div>
          <span class="label">机构路径</span>
          <strong id="review-group-count">—</strong>
        </div>
        <div>
          <span class="label">导师</span>
          <strong id="review-row-count">—</strong>
        </div>
        <div id="review-invalid-summary">
          <span class="label">未进入审核</span>
          <strong id="review-invalid-count">—</strong>
        </div>
        <div id="review-identity-summary">
          <span class="label">任职待判断</span>
          <strong id="review-identity-count">—</strong>
        </div>
      </section>

      <details id="invalid-rows-panel" class="invalid-rows-panel" hidden>
        <summary>查看未进入审核的数据</summary>
        <div id="invalid-rows" class="invalid-rows"></div>
      </details>

      <section id="review-workspace" class="review-workspace" hidden>
        <header class="workflow-heading" hidden>
          <h2 aria-live="polite">待处理 <strong id="workflow-pending-count">—</strong></h2>
        </header>

        <p id="autosave-status" class="autosave-status" aria-live="polite"></p>

        <div class="review-workspace-grid">
          <nav class="review-task-rail" aria-label="审核事项">
            <div class="task-filter" role="tablist" aria-label="筛选审核事项">
              <button id="task-filter-pending" type="button" role="tab" aria-selected="true">
                待处理 <span id="task-filter-pending-count">0</span>
              </button>
              <button id="task-filter-done" type="button" role="tab" aria-selected="false">
                已处理 <span id="task-filter-done-count">0</span>
              </button>
              <button id="task-filter-all" type="button" role="tab" aria-selected="false">
                全部 <span id="task-filter-all-count">0</span>
              </button>
            </div>
            <div id="review-task-list" class="review-task-list"></div>
          </nav>

          <div class="review-task-main">
            <section id="review-task-stage" class="review-task-stage" aria-live="polite" tabindex="-1">
              <div id="review-task-empty" class="review-task-empty" hidden>
                <h3>已处理完</h3>
              </div>

              <section id="organizations-section" class="organizations-section" hidden>
                <div class="task-section-heading" hidden>
                  <h2>确认机构</h2>
                  <div class="review-progress-actions" hidden>
                    <span id="organization-progress" class="organization-progress">—</span>
                    <button id="next-pending" class="secondary-button" type="button">处理下一项</button>
                  </div>
                </div>
                <div id="organization-tree" class="organization-tree"></div>
              </section>

              <section id="groups-section" class="groups-section" hidden>
                <div id="review-groups" class="review-groups"></div>
              </section>
            </section>

            <footer class="review-workflow-bar">
              <button id="previous-review-task" class="secondary-button" type="button">上一项</button>
              <p id="workflow-position" aria-live="polite">—</p>
              <button id="next-review-task" class="primary-button" type="button">下一项</button>
            </footer>
          </div>
        </div>
      </section>

      <section id="empty-review" class="empty-review" hidden>
        <h2>没有可审核的导师</h2>
        <p>导师数据未通过基础检查。</p>
      </section>

      <section id="decision-panel" class="decision-panel" hidden>
        <div class="decision-actions">
          <h2>最终检查</h2>
          <button id="generate-decision" class="primary-button" type="button">生成审核评论</button>
        </div>
        <p id="decision-error" class="error" hidden></p>
        <div id="decision-preview" class="decision-preview" hidden></div>
        <div id="decision-output" class="decision-output" hidden>
          <label for="decision-text">审核评论已经生成</label>
          <textarea id="decision-text" rows="12" readonly spellcheck="false"></textarea>
          <button id="copy-open-pr" class="primary-button" type="button">复制评论并打开 PR</button>
          <p id="copy-status" class="copy-status" aria-live="polite"></p>
        </div>
      </section>

    </main>
    <script src="review-logic.js?v=6" defer></script>
    <script src="review.js?v=6" defer></script>
  </body>
</html>

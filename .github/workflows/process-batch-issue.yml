name: Process batch contribution Issue

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open batch contribution Issue to process or retry
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'submission:batch')
    concurrency:
      group: process-batch-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      SOURCE_EVENT: .work/source-issue-event.json
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Resolve source Issue event
        run: |
          case "$ISSUE_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          mkdir -p .work
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            cp "$GITHUB_EVENT_PATH" "$SOURCE_EVENT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
              --jq '{action: "opened", issue: .}' > "$SOURCE_EVENT"
          else
            exit 1
          fi

      - name: Inspect durable Issue workflow state
        id: workflow_state
        run: |
          uv run python scripts/issue_workflow_state.py \
            --event "$SOURCE_EVENT" \
            --repository "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER" \
            --kind batch \
            --github-output "$GITHUB_OUTPUT"

      - name: Download and parse untrusted attachment as data
        if: steps.workflow_state.outputs.process == 'true'
        run: |
          uv run mentor-data prepare-batch \
            --event "$SOURCE_EVENT" \
            --output .work/proposals \
            --review-output .work/organization-review.json \
            --proposal-directory "proposals/batch-issue-${ISSUE_NUMBER}"

      - name: Read trusted proposal-set metadata
        if: steps.workflow_state.outputs.process == 'true'
        id: metadata
        run: >-
          uv run python scripts/proposal_set_metadata.py .work/proposals
          --review .work/organization-review.json

      - name: Store the complete batch proposal set
        if: steps.workflow_state.outputs.process == 'true'
        run: |
          mkdir -p "proposals/batch-issue-${ISSUE_NUMBER}" reviews/pending
          cp -R .work/proposals/. "proposals/batch-issue-${ISSUE_NUMBER}/"
          cp .work/organization-review.json \
            "reviews/pending/batch-issue-${ISSUE_NUMBER}.json"
          uv run mentor-data validate

      - name: Rehearse auto-eligible batch
        if: >-
          steps.workflow_state.outputs.process == 'true' &&
          steps.metadata.outputs.all_auto_eligible == 'true'
        run: uv run mentor-data check-proposal-set

      - name: Create stable proposal branch and Pull Request
        if: steps.workflow_state.outputs.process == 'true'
        id: pull_request
        env:
          ALL_AUTO_ELIGIBLE: ${{ steps.metadata.outputs.all_auto_eligible }}
          PROPOSAL_COUNT: ${{ steps.metadata.outputs.proposal_count }}
          INVALID_ROW_COUNT: ${{ steps.metadata.outputs.invalid_row_count }}
          BRANCH: ${{ steps.workflow_state.outputs.branch }}
        run: |
          case "$ISSUE_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          case "$PROPOSAL_COUNT" in ''|*[!0-9]*) exit 1 ;; esac
          case "$INVALID_ROW_COUNT" in ''|*[!0-9]*) exit 1 ;; esac
          case "$BRANCH" in "batch/issue-${ISSUE_NUMBER}") ;; *) exit 1 ;; esac
          REMOTE_SHA=$(git ls-remote --heads origin "refs/heads/${BRANCH}" | awk '{print $1}')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH" main
          git add -- "reviews/pending/batch-issue-${ISSUE_NUMBER}.json"
          if [ "$PROPOSAL_COUNT" -gt 0 ]; then
            git add -- "proposals/batch-issue-${ISSUE_NUMBER}"
          fi
          git commit -m "data: prepare batch submission #${ISSUE_NUMBER}"
          if [ -n "$REMOTE_SHA" ]; then
            git push \
              --force-with-lease="refs/heads/${BRANCH}:${REMOTE_SHA}" \
              origin "HEAD:refs/heads/${BRANCH}"
          else
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi
          PR_ARGS=(
            --event "$SOURCE_EVENT"
            --repository "$GITHUB_REPOSITORY"
            --issue-number "$ISSUE_NUMBER"
            --kind batch
            --head "$BRANCH"
          )
          if [ "$ALL_AUTO_ELIGIBLE" = "true" ]; then
            PR_ARGS+=(
              --label status:auto-eligible
              --body "共 ${PROPOSAL_COUNT} 条有效提案，已通过自动校验，正在等待按顺序写入社区导师库。关联 Issue #${ISSUE_NUMBER}。"
            )
          else
            PR_ARGS+=(
              --draft
              --label status:manual-review
              --body "共 ${PROPOSAL_COUNT} 条有效提案、${INVALID_ROW_COUNT} 条普通无效行。请使用机构审核页面统一学校和学院；审核完成后会自动写入。关联 Issue #${ISSUE_NUMBER}。"
            )
          fi
          PR_URL=$(uv run python scripts/create_issue_pull_request.py "${PR_ARGS[@]}")
          PR_NUMBER="${PR_URL##*/}"
          case "$PR_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          if [ "$ALL_AUTO_ELIGIBLE" = "true" ]; then
            REVIEW_URL="$PR_URL"
          else
            REVIEW_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/AutoEmailSender-MentorData/review.html?pr=${PR_NUMBER}"
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "review_url=$REVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Post the only Issue status notification
        if: >-
          always() &&
          steps.workflow_state.outputs.outcome != 'finalized' &&
          steps.workflow_state.outputs.outcome != 'closed_pull'
        env:
          JOB_STATUS: ${{ job.status }}
          ALL_AUTO_ELIGIBLE: ${{ steps.metadata.outputs.all_auto_eligible }}
          PR_URL: ${{ steps.pull_request.outputs.pr_url }}
          REVIEW_URL: ${{ steps.pull_request.outputs.review_url }}
          WORKFLOW_OUTCOME: ${{ steps.workflow_state.outputs.outcome }}
          EXISTING_PR_URL: ${{ steps.workflow_state.outputs.pr_url }}
        run: |
          case "$ISSUE_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          MARKER="<!-- mentor-data-status:v1 -->"
          COMMENT_IDS=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- mentor-data-status:v1 -->"))) | .id')
          COMMENT_ID=${COMMENT_IDS%%$'\n'*}
          if [ "$WORKFLOW_OUTCOME" = "existing_pull" ] && [ -n "$COMMENT_ID" ]; then
            exit 0
          elif [ "$WORKFLOW_OUTCOME" = "existing_pull" ]; then
            MESSAGE="批量投稿已经有对应的审核记录，不会重复创建。[查看记录](${EXISTING_PR_URL})"
          elif [ "$JOB_STATUS" = "success" ] && [ "$ALL_AUTO_ELIGIBLE" = "true" ]; then
            MESSAGE="批量投稿已通过自动校验，正在等待社区库按顺序处理。[查看记录](${PR_URL})"
          elif [ "$JOB_STATUS" = "success" ]; then
            MESSAGE="批量投稿已安全解析，原始附件不会写入仓库。[继续审核](${REVIEW_URL}) 审核完成后会自动写入和发布。"
          else
            MESSAGE="批量附件下载、校验或提案生成未通过，社区数据没有改变。维护者可查看本次 Actions 日志。"
          fi
          BODY="${MARKER}"$'\n'"${MESSAGE}"
          case "$COMMENT_ID" in
            '') gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY" ;;
            *[!0-9]*) exit 1 ;;
            *) gh api --method PATCH \
                 "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
                 -f "body=$BODY" >/dev/null ;;
          esac

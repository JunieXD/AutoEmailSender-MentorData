name: Process batch contribution Issue

on:
  issues:
    types: [opened, reopened]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: mentor-data-write
  cancel-in-progress: false

jobs:
  prepare:
    if: contains(github.event.issue.labels.*.name, 'submission:batch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Download and parse untrusted attachment as data
        run: |
          uv run mentor-data prepare-batch \
            --event "$GITHUB_EVENT_PATH" \
            --output .work/proposals

      - name: Read trusted proposal-set metadata
        id: metadata
        run: uv run python scripts/proposal_set_metadata.py .work/proposals

      - name: Finalize canonical data for auto-eligible batch
        if: steps.metadata.outputs.all_auto_eligible == 'true'
        run: |
          uv run mentor-data finalize-proposal-set .work/proposals
          uv run mentor-data validate
          uv run pytest

      - name: Store manual-review proposals
        if: steps.metadata.outputs.all_auto_eligible != 'true'
        run: |
          mkdir -p "proposals/batch-issue-${ISSUE_NUMBER}"
          cp .work/proposals/*.json "proposals/batch-issue-${ISSUE_NUMBER}/"

      - name: Create internal review branch and Pull Request
        id: pull_request
        env:
          ALL_AUTO_ELIGIBLE: ${{ steps.metadata.outputs.all_auto_eligible }}
          PROPOSAL_COUNT: ${{ steps.metadata.outputs.proposal_count }}
        run: |
          case "$ISSUE_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          case "$RUN_ID" in ''|*[!0-9]*) exit 1 ;; esac
          case "$PROPOSAL_COUNT" in ''|*[!0-9]*) exit 1 ;; esac
          if [ "$ALL_AUTO_ELIGIBLE" = "true" ]; then
            BRANCH="automatic-batch/issue-${ISSUE_NUMBER}-${RUN_ID}"
          else
            BRANCH="batch/issue-${ISSUE_NUMBER}-${RUN_ID}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add claims records proposals
          git commit -m "data: prepare batch submission #${ISSUE_NUMBER}"
          git push origin "$BRANCH"
          if [ "$ALL_AUTO_ELIGIBLE" = "true" ]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "自动处理批量导师投稿 #${ISSUE_NUMBER}" \
              --body "共 ${PROPOSAL_COUNT} 行。由受信任默认分支工作流生成；关联 Issue #${ISSUE_NUMBER}。")
            gh pr merge "$PR_URL" --squash --delete-branch
          else
            PR_URL=$(gh pr create \
              --draft \
              --base main \
              --head "$BRANCH" \
              --title "审核批量导师投稿 #${ISSUE_NUMBER}" \
              --body "共 ${PROPOSAL_COUNT} 行。请逐项核对 accepted、target_mentor_id、机构映射和 review_reasons；关联 Issue #${ISSUE_NUMBER}。")
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Publish auto-eligible canonical batch
        if: steps.metadata.outputs.all_auto_eligible == 'true'
        run: gh workflow run pages.yml --ref main

      - name: Link review Pull Request from Issue
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "批量文件已安全解析为逐行提案，原始附件不会写入仓库。审核记录：${{ steps.pull_request.outputs.pr_url }}"

      - name: Explain validation failure without echoing untrusted data
        if: failure()
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "批量附件下载、校验或提案生成未通过。当前数据集未发生变化；维护者可查看固定格式错误。"

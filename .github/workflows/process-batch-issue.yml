name: Process batch contribution Issue

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: mentor-data-write
  cancel-in-progress: false

jobs:
  prepare:
    if: contains(github.event.issue.labels.*.name, 'submission:batch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Download and parse untrusted attachment as data
        run: |
          uv run mentor-data prepare-batch \
            --event "$GITHUB_EVENT_PATH" \
            --output .work/proposals \
            --review-output .work/organization-review.json \
            --proposal-directory "proposals/batch-issue-${ISSUE_NUMBER}"

      - name: Read trusted proposal-set metadata
        id: metadata
        run: >-
          uv run python scripts/proposal_set_metadata.py .work/proposals
          --review .work/organization-review.json

      - name: Finalize canonical data for auto-eligible batch
        if: steps.metadata.outputs.all_auto_eligible == 'true'
        run: |
          uv run mentor-data finalize-proposal-set .work/proposals
          uv run mentor-data validate
          uv run pytest

      - name: Store manual-review proposals
        if: steps.metadata.outputs.all_auto_eligible != 'true'
        run: |
          mkdir -p "proposals/batch-issue-${ISSUE_NUMBER}"
          mkdir -p reviews/pending
          cp -R .work/proposals/. "proposals/batch-issue-${ISSUE_NUMBER}/"
          cp .work/organization-review.json \
            "reviews/pending/batch-issue-${ISSUE_NUMBER}.json"

      - name: Create internal review branch and Pull Request
        id: pull_request
        env:
          ALL_AUTO_ELIGIBLE: ${{ steps.metadata.outputs.all_auto_eligible }}
          PROPOSAL_COUNT: ${{ steps.metadata.outputs.proposal_count }}
          INVALID_ROW_COUNT: ${{ steps.metadata.outputs.invalid_row_count }}
        run: |
          case "$ISSUE_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          case "$RUN_ID" in ''|*[!0-9]*) exit 1 ;; esac
          case "$PROPOSAL_COUNT" in ''|*[!0-9]*) exit 1 ;; esac
          case "$INVALID_ROW_COUNT" in ''|*[!0-9]*) exit 1 ;; esac
          echo "merged=false" >> "$GITHUB_OUTPUT"
          if [ "$ALL_AUTO_ELIGIBLE" = "true" ]; then
            BRANCH="automatic-batch/issue-${ISSUE_NUMBER}-${RUN_ID}"
          else
            BRANCH="batch/issue-${ISSUE_NUMBER}-${RUN_ID}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add claims records proposals
          if [ -d reviews ]; then
            git add reviews
          fi
          git commit -m "data: prepare batch submission #${ISSUE_NUMBER}"
          git push origin "$BRANCH"
          if [ "$ALL_AUTO_ELIGIBLE" = "true" ]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "自动处理批量导师投稿 #${ISSUE_NUMBER}" \
              --body "共 ${PROPOSAL_COUNT} 条有效提案。由受信任默认分支工作流生成；关联 Issue #${ISSUE_NUMBER}。")
            gh pr merge "$PR_URL" --squash --delete-branch
            echo "merged=true" >> "$GITHUB_OUTPUT"
            REVIEW_URL="$PR_URL"
          else
            PR_URL=$(gh pr create \
              --draft \
              --base main \
              --head "$BRANCH" \
              --title "审核批量导师投稿 #${ISSUE_NUMBER}" \
              --body "共 ${PROPOSAL_COUNT} 条有效提案、${INVALID_ROW_COUNT} 条普通无效行。请先使用机构审核助手统一学校与学院命名；关联 Issue #${ISSUE_NUMBER}。")
            PR_NUMBER="${PR_URL##*/}"
            case "$PR_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
            REVIEW_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/AutoEmailSender-MentorData/review.html?pr=${PR_NUMBER}"
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "review_url=$REVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Publish auto-eligible canonical batch
        id: publish
        if: steps.metadata.outputs.all_auto_eligible == 'true'
        run: |
          case "$ISSUE_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          gh workflow run pages.yml --ref main -f "issue_number=$ISSUE_NUMBER"

      - name: Post the only Issue status notification
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          ALL_AUTO_ELIGIBLE: ${{ steps.metadata.outputs.all_auto_eligible }}
          MERGED: ${{ steps.pull_request.outputs.merged }}
          PR_URL: ${{ steps.pull_request.outputs.pr_url }}
          REVIEW_URL: ${{ steps.pull_request.outputs.review_url }}
        run: |
          case "$ISSUE_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          if [ "$JOB_STATUS" = "success" ] && [ "$ALL_AUTO_ELIGIBLE" = "true" ]; then
            MESSAGE="批量投稿已安全解析并进入社区数据，原始附件不会写入仓库。发布成功后，本 Issue 会自动关闭。审核记录：${PR_URL}"
          elif [ "$JOB_STATUS" = "success" ]; then
            MESSAGE="批量投稿已安全解析，原始附件不会写入仓库。请由维护者继续审核：${REVIEW_URL}。后续不再重复发送进度评论；审核和发布成功后，本 Issue 会自动关闭。"
          elif [ "$MERGED" = "true" ]; then
            MESSAGE="规范数据已经合并，但发布任务未成功启动。本 Issue 会保持开启，等待维护者补发。"
          else
            MESSAGE="批量附件下载、校验或提案生成未通过，社区数据没有改变。维护者可查看本次 Actions 的固定格式日志。"
          fi
          MARKER="<!-- mentor-data-status:v1 -->"
          BODY="${MARKER}"$'\n'"${MESSAGE}"
          COMMENT_IDS=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- mentor-data-status:v1 -->"))) | .id')
          COMMENT_ID=${COMMENT_IDS%%$'\n'*}
          case "$COMMENT_ID" in
            '') gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY" ;;
            *[!0-9]*) exit 1 ;;
            *) gh api --method PATCH \
                 "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
                 -f "body=$BODY" >/dev/null ;;
          esac

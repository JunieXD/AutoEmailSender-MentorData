name: Finalize merged moderation proposal

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      head_ref:
        description: Trusted internal batch branch that was merged by the review workflow
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: read

jobs:
  finalize:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       startsWith(inputs.head_ref, 'batch/issue-')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (startsWith(github.event.pull_request.head.ref, 'submission/issue-') ||
        startsWith(github.event.pull_request.head.ref, 'batch/issue-') ||
        startsWith(github.event.pull_request.head.ref, 'report/issue-')))
    concurrency:
      group: mentor-data-write
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || github.event.pull_request.head.ref }}
      MERGED_BY_ID: ${{ github.event.pull_request.merged_by.id || '' }}
      MERGED_BY_LOGIN: ${{ github.event.pull_request.merged_by.login || '' }}
    steps:
      - name: Check out merged main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Parse trusted internal branch name
        id: branch
        run: uv run python scripts/parse_workflow_branch.py

      - name: Read source Issue state
        id: issue
        env:
          ISSUE_NUMBER: ${{ steps.branch.outputs.issue_number }}
        run: |
          case "$ISSUE_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          STATE=$(gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json state \
            --jq .state)
          case "$STATE" in
            OPEN) echo "open=true" >> "$GITHUB_OUTPUT" ;;
            CLOSED) echo "open=false" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

      - name: Reject an unrecognized duplicate finalization
        if: >-
          steps.branch.outputs.pending != 'true' &&
          steps.branch.outputs.finalized != 'true'
        run: |
          echo "The branch has neither a pending proposal nor a finalized result." >&2
          exit 1

      - name: Finalize accepted mentor contribution
        if: >-
          steps.branch.outputs.pending == 'true' &&
          steps.branch.outputs.kind == 'submission'
        run: |
          uv run mentor-data finalize-proposal \
            "proposals/issue-${{ steps.branch.outputs.issue_number }}.json" \
            --moderator-id "$MERGED_BY_ID"
          git rm "proposals/issue-${{ steps.branch.outputs.issue_number }}.json"

      - name: Finalize accepted batch contribution
        if: >-
          steps.branch.outputs.pending == 'true' &&
          steps.branch.outputs.kind == 'batch'
        env:
          MODERATOR_ID: ${{ steps.branch.outputs.moderator_id }}
        run: |
          uv run mentor-data finalize-proposal-set \
            "proposals/batch-issue-${{ steps.branch.outputs.issue_number }}" \
            --moderator-id "$MODERATOR_ID"
          git rm -r "proposals/batch-issue-${{ steps.branch.outputs.issue_number }}"
          git rm --ignore-unmatch \
            "reviews/pending/batch-issue-${{ steps.branch.outputs.issue_number }}.json"

      - name: Finalize correction decision
        if: >-
          steps.branch.outputs.pending == 'true' &&
          steps.branch.outputs.kind == 'report'
        run: |
          uv run mentor-data finalize-report-proposal \
            "reports/pending/issue-${{ steps.branch.outputs.issue_number }}.json" \
            --moderator-id "$MERGED_BY_ID" \
            --moderator-login "$MERGED_BY_LOGIN"
          git rm "reports/pending/issue-${{ steps.branch.outputs.issue_number }}.json"

      - name: Validate final state
        if: steps.branch.outputs.pending == 'true'
        run: |
          uv run mentor-data validate
          uv run pytest

      - name: Commit finalized canonical data
        if: steps.branch.outputs.pending == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add claims records registry reports proposals
          if [ -d reviews ]; then
            git add reviews
          fi
          git commit -m "data: finalize moderation for issue #${{ steps.branch.outputs.issue_number }}"
          git push origin HEAD:main

      - name: Publish finalized canonical change
        id: publish
        if: >-
          steps.branch.outputs.pending == 'true' ||
          (steps.branch.outputs.finalized == 'true' &&
           steps.issue.outputs.open == 'true')
        env:
          ISSUE_NUMBER: ${{ steps.branch.outputs.issue_number }}
        run: |
          case "$ISSUE_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          gh workflow run pages.yml \
            --ref main \
            -f "issue_number=$ISSUE_NUMBER"

      - name: Treat an already finalized duplicate trigger as success
        if: >-
          steps.branch.outputs.pending != 'true' &&
          steps.branch.outputs.finalized == 'true' &&
          steps.issue.outputs.open != 'true'
        run: echo "This moderation branch has already been finalized; nothing to do."

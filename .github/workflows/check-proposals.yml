name: Check moderation proposals

on:
  pull_request:
    paths:
      - "proposals/**"
      - "reports/pending/**"
      - "registry/organizations.yml"
      - "records/mentors/**"
      - "claims/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Pull Request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Validate repository and rehearse pending proposals in order
        run: |
          uv run mentor-data validate
          uv run mentor-data check-proposal-set
          for proposal in reports/pending/*.json; do
            [ -e "$proposal" ] || continue
            uv run mentor-data check-report-proposal "$proposal"
          done

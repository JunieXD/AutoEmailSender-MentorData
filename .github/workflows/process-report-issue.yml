name: Process correction report Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: mentor-data-write
  cancel-in-progress: false

jobs:
  prepare:
    if: contains(github.event.issue.labels.*.name, 'report:data')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Parse untrusted report as data
        run: |
          uv run mentor-data prepare-report \
            --event "$GITHUB_EVENT_PATH" \
            --output .work/reports

      - name: Create internal Draft Pull Request
        id: pull_request
        run: |
          case "$ISSUE_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          case "$RUN_ID" in ''|*[!0-9]*) exit 1 ;; esac
          BRANCH="report/issue-${ISSUE_NUMBER}-${RUN_ID}"
          mkdir -p reports/pending
          cp ".work/reports/issue-${ISSUE_NUMBER}.json" "reports/pending/issue-${ISSUE_NUMBER}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add reports/pending
          git commit -m "data: prepare correction report #${ISSUE_NUMBER}"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "审核导师信息反馈 #${ISSUE_NUMBER}" \
            --body "请将 decision 从 pending 改为最终裁决，填写 moderator_reason；接受修改时还需填写 accepted。关联 Issue #${ISSUE_NUMBER}。")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Post the only Issue status notification
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PR_URL: ${{ steps.pull_request.outputs.pr_url }}
        run: |
          case "$ISSUE_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          if [ "$JOB_STATUS" = "success" ]; then
            MESSAGE="反馈已进入人工审核，不会直接修改社区数据：${PR_URL}。后续不再重复发送进度评论；审核和发布成功后，本 Issue 会自动关闭。"
          else
            MESSAGE="反馈自动校验未通过，社区数据没有变化。维护者可查看本次 Actions 的固定格式日志。"
          fi
          MARKER="<!-- mentor-data-status:v1 -->"
          BODY="${MARKER}"$'\n'"${MESSAGE}"
          COMMENT_IDS=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- mentor-data-status:v1 -->"))) | .id')
          COMMENT_ID=${COMMENT_IDS%%$'\n'*}
          case "$COMMENT_ID" in
            '') gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY" ;;
            *[!0-9]*) exit 1 ;;
            *) gh api --method PATCH \
                 "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
                 -f "body=$BODY" >/dev/null ;;
          esac

name: Publish GitHub Pages dataset

on:
  push:
    branches: [main]
    paths:
      - "claims/**"
      - "records/**"
      - "registry/**"
      - "reports/resolutions/**"
      - "schemas/**"
      - "mentor_data/**"
      - "site/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Restore immutable dataset archive
        run: |
          mkdir -p dist .work
          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add --detach .work/pages origin/gh-pages
            if [ -d .work/pages/datasets ]; then
              cp -R .work/pages/datasets dist/
            fi
          else
            git worktree add --detach .work/pages HEAD
            git -C .work/pages switch --orphan gh-pages
            git -C .work/pages rm -rf --ignore-unmatch .
          fi

      - name: Validate and build immutable dataset
        run: |
          uv run mentor-data validate
          uv run mentor-data build --output dist

      - name: Archive every published version on gh-pages branch
        run: |
          rsync -a --delete --exclude='.git' dist/ .work/pages/
          touch .work/pages/.nojekyll
          git -C .work/pages config user.name "github-actions[bot]"
          git -C .work/pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .work/pages add -A
          git -C .work/pages commit -m "data: publish immutable dataset ${GITHUB_RUN_ID}"
          git -C .work/pages push origin HEAD:gh-pages

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

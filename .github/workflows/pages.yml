name: Publish GitHub Pages dataset

on:
  push:
    branches: [main]
    paths:
      - "claims/**"
      - "records/**"
      - "registry/**"
      - "reports/resolutions/**"
      - "schemas/**"
      - "mentor_data/**"
      - "site/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Restore immutable dataset archive
        run: |
          mkdir -p dist .work
          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add --detach .work/pages origin/gh-pages
            if [ -d .work/pages/datasets ]; then
              cp -R .work/pages/datasets dist/
            fi
          else
            git worktree add --detach .work/pages HEAD
            git -C .work/pages switch --orphan gh-pages
            git -C .work/pages rm -rf --ignore-unmatch .
          fi

      - name: Validate and build immutable dataset
        run: |
          uv run mentor-data validate
          uv run mentor-data build --output dist

      - name: Archive every published version on gh-pages branch
        run: |
          rsync -a --delete --exclude='.git' dist/ .work/pages/
          touch .work/pages/.nojekyll
          git -C .work/pages config user.name "github-actions[bot]"
          git -C .work/pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .work/pages add -A
          git -C .work/pages commit -m "data: publish immutable dataset ${GITHUB_RUN_ID}"
          git -C .work/pages push origin HEAD:gh-pages

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

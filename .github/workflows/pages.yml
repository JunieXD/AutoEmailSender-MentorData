name: Publish GitHub Pages dataset

on:
  push:
    branches: [main]
    paths:
      - "claims/**"
      - "records/**"
      - "registry/**"
      - "reports/resolutions/**"
      - "reviews/resolutions/**"
      - "reviews/promotions/**"
      - "schemas/**"
      - "mentor_data/**"
      - "scripts/finalized_issue_numbers.py"
      - "site/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact main revision being published
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Restore the immutable publication archive
        run: |
          mkdir -p .work
          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
            git worktree add --detach .work/pages refs/remotes/origin/gh-pages
          else
            git worktree add --detach .work/pages HEAD
            git -C .work/pages switch --orphan gh-pages
            git -C .work/pages rm -rf --ignore-unmatch .
          fi

      - name: Validate and append the current content-addressed release
        run: |
          uv run mentor-data validate
          uv run mentor-data build --output .work/pages
          git -C .work/pages rm -r --ignore-unmatch datasets
          touch .work/pages/.nojekyll

      - name: Archive only when published content changed
        run: |
          git -C .work/pages config user.name "github-actions[bot]"
          git -C .work/pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .work/pages add -A
          if git -C .work/pages diff --cached --quiet; then
            echo "The publication archive is already current."
          else
            VERSION=$(uv run python -c \
              'import json; print(json.load(open(".work/pages/latest.json", encoding="utf-8"))["dataset_version"])')
            git -C .work/pages commit -m "data: publish ${VERSION}"
            git -C .work/pages push origin HEAD:gh-pages
          fi

      - name: Stage only the current release for deployment
        run: uv run mentor-data stage-current --archive .work/pages --output dist

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  close-issues:
    if: always() && needs.deploy.result == 'success'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the same published main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Close every newly published source Issue
        run: |
          mkdir -p .work
          uv run python scripts/finalized_issue_numbers.py \
            --output .work/finalized-issues.txt
          while IFS= read -r ISSUE_NUMBER; do
            case "$ISSUE_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
            ISSUE_STATE=$(gh api \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
              --jq 'if has("pull_request") then "pull" else .state end')
            if [ "$ISSUE_STATE" = "open" ]; then
              gh issue close "$ISSUE_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --reason completed
            fi
          done < .work/finalized-issues.txt

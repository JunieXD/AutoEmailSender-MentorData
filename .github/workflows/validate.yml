name: Validate repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted repository content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Lint Python
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

      - name: Test reviewer browser logic
        run: node --test tests/review-logic.test.js

      - name: Validate repository data
        run: uv run mentor-data validate

      - name: Test production dataset build
        run: uv run mentor-data build --output dist

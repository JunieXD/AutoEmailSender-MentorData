name: Promote ready mentor data Pull Requests

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [ready_for_review, synchronize, reopened]
  workflow_run:
    workflows:
      - Process mentor contribution Issue
      - Process batch contribution Issue
      - Process correction report Issue
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      include_attention:
        description: Retry PRs currently marked as needing attention
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: mentor-data-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                 github.event.comment.author_association) &&
        (startsWith(github.event.comment.body, '<!-- mentor-data-organization-review:v1 -->') ||
         startsWith(github.event.comment.body, '<!-- mentor-data-report-review:v1 -->')))) &&
      (github.event_name != 'pull_request_target' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Install locked trusted dependencies
        run: uv sync --locked --dev

      - name: Validate current canonical data
        run: uv run mentor-data validate

      - name: Promote every durable ready Pull Request in order
        id: promotion
        env:
          INCLUDE_ATTENTION: ${{ inputs.include_attention || 'false' }}
        run: |
          ARGS=(
            --repository "$GITHUB_REPOSITORY"
            --github-output "$GITHUB_OUTPUT"
          )
          if [ "$INCLUDE_ATTENTION" = "true" ]; then
            ARGS+=(--include-attention)
          fi
          uv run python scripts/promote_ready_pull_requests.py "${ARGS[@]}"

      - name: Publish once after processing the queue
        if: steps.promotion.outputs.publish == 'true'
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

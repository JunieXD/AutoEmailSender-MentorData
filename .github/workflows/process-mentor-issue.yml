name: Process mentor contribution Issue

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open single-mentor contribution Issue to process or retry
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'submission:mentor')
    concurrency:
      group: mentor-data-write
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      SOURCE_EVENT: .work/source-issue-event.json
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Resolve source Issue event
        run: |
          case "$ISSUE_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          mkdir -p .work
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            cp "$GITHUB_EVENT_PATH" "$SOURCE_EVENT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
              --jq '{action: "opened", issue: .}' > "$SOURCE_EVENT"
          else
            exit 1
          fi

      - name: Parse untrusted Issue as data
        run: |
          uv run mentor-data prepare-issue \
            --event "$SOURCE_EVENT" \
            --output .work/proposals

      - name: Read trusted proposal metadata
        id: metadata
        run: uv run python scripts/proposal_metadata.py ".work/proposals/issue-${ISSUE_NUMBER}.json"

      - name: Finalize canonical data for auto-eligible submission
        if: steps.metadata.outputs.auto_eligible == 'true'
        run: |
          uv run mentor-data finalize-proposal \
            ".work/proposals/issue-${ISSUE_NUMBER}.json"
          uv run mentor-data validate
          uv run pytest

      - name: Store manual-review proposal
        if: steps.metadata.outputs.auto_eligible != 'true'
        run: |
          mkdir -p proposals
          cp ".work/proposals/issue-${ISSUE_NUMBER}.json" "proposals/issue-${ISSUE_NUMBER}.json"

      - name: Create internal review branch and Pull Request
        id: pull_request
        env:
          AUTO_ELIGIBLE: ${{ steps.metadata.outputs.auto_eligible }}
        run: |
          case "$ISSUE_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          case "$RUN_ID" in ''|*[!0-9]*) exit 1 ;; esac
          case "$RUN_ATTEMPT" in ''|*[!0-9]*) exit 1 ;; esac
          echo "merged=false" >> "$GITHUB_OUTPUT"
          if [ "$AUTO_ELIGIBLE" = "true" ]; then
            BRANCH="automatic/issue-${ISSUE_NUMBER}-${RUN_ID}-${RUN_ATTEMPT}"
          else
            BRANCH="submission/issue-${ISSUE_NUMBER}-${RUN_ID}-${RUN_ATTEMPT}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add claims records proposals
          git commit -m "data: prepare mentor submission #${ISSUE_NUMBER}"
          git push origin "$BRANCH"
          if [ "$AUTO_ELIGIBLE" = "true" ]; then
            PR_URL=$(uv run python scripts/create_issue_pull_request.py \
              --event "$SOURCE_EVENT" \
              --repository "$GITHUB_REPOSITORY" \
              --issue-number "$ISSUE_NUMBER" \
              --kind mentor \
              --head "$BRANCH" \
              --body "由受信任默认分支工作流生成。关联 Issue #${ISSUE_NUMBER}。")
            gh pr merge "$PR_URL" --squash --delete-branch
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            PR_URL=$(uv run python scripts/create_issue_pull_request.py \
              --event "$SOURCE_EVENT" \
              --repository "$GITHUB_REPOSITORY" \
              --issue-number "$ISSUE_NUMBER" \
              --kind mentor \
              --head "$BRANCH" \
              --draft \
              --body "请核对 accepted、target_mentor_id、机构映射和 review_reasons。确认后将 Draft 标记为 Ready 并合并；关联 Issue #${ISSUE_NUMBER}。")
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Publish auto-eligible canonical change
        id: publish
        if: steps.metadata.outputs.auto_eligible == 'true'
        run: |
          case "$ISSUE_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          gh workflow run pages.yml --ref main -f "issue_number=$ISSUE_NUMBER"

      - name: Post the only Issue status notification
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          AUTO_ELIGIBLE: ${{ steps.metadata.outputs.auto_eligible }}
          MERGED: ${{ steps.pull_request.outputs.merged }}
          PR_URL: ${{ steps.pull_request.outputs.pr_url }}
        run: |
          case "$ISSUE_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          if [ "$JOB_STATUS" = "success" ] && [ "$AUTO_ELIGIBLE" = "true" ]; then
            MESSAGE="投稿已通过自动校验并进入社区数据。发布成功后，本 Issue 会自动关闭。审核记录：${PR_URL}"
          elif [ "$JOB_STATUS" = "success" ]; then
            MESSAGE="投稿已完成安全校验并进入维护者审核：${PR_URL} 。后续不再重复发送进度评论；审核和发布成功后，本 Issue 会自动关闭。"
          elif [ "$MERGED" = "true" ]; then
            MESSAGE="规范数据已经合并，但发布任务未成功启动。本 Issue 会保持开启，等待维护者补发。"
          else
            MESSAGE="自动校验或提案生成未通过，社区数据没有改变。维护者可查看本次 Actions 的固定格式日志。"
          fi
          MARKER="<!-- mentor-data-status:v1 -->"
          BODY="${MARKER}"$'\n'"${MESSAGE}"
          COMMENT_IDS=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- mentor-data-status:v1 -->"))) | .id')
          COMMENT_ID=${COMMENT_IDS%%$'\n'*}
          case "$COMMENT_ID" in
            '') gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY" ;;
            *[!0-9]*) exit 1 ;;
            *) gh api --method PATCH \
                 "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
                 -f "body=$BODY" >/dev/null ;;
          esac

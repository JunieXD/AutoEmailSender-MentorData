name: 反馈导师信息问题
description: 发现邮箱、学校、职称或导师状态有误、过时，可在这里告诉我们。
title: "[信息反馈] "
labels:
  - report:data
body:
  - type: markdown
    attributes:
      value: |
        **先核对上方标题：** 应写成 `[信息反馈] XXX大学XXX老师`；从软件打开时会自动填写。

        请告诉我们哪位老师、哪里不对，并附上能证明新情况的高校官网页面。反馈会先由维护者核对，不会直接修改或删除数据。

        从 Auto Email Sender 的导师条目点击“反馈错误”时，标题、导师信息和“现在显示的内容”会自动填写；你只需选择问题，并补充正确内容和新的官网证据。

  - type: input
    id: record_id
    attributes:
      label: 要反馈的导师（软件自动填写）
      description: 从软件打开时会自动填写，请不要修改；如果这里为空，请回到软件，从导师详情打开“反馈错误”。
      placeholder: 这里通常会由软件自动填写
    validations:
      required: true

  - type: dropdown
    id: report_type
    attributes:
      label: 发现了什么问题
      options:
        - 姓名、邮箱、学校或其他内容有误
        - 信息已经过时
        - 老师已经退休
        - 老师已经离职或调动
        - 老师已经去世
        - 同一位老师重复出现
        - 邮箱已经属于别人或多人共用
        - 老师本人或学校要求删除
        - 其他
    validations:
      required: true

  - type: textarea
    id: affected_fields
    attributes:
      label: 哪里有问题
      description: 简单写出有问题的项目。
      placeholder: 例如：工作邮箱、学院、职称、导师状态
    validations:
      required: true

  - type: textarea
    id: current_value
    attributes:
      label: 现在显示的内容（选填）
      description: 从软件打开时通常会自动填写；没有或不清楚可以留空。
      placeholder: 例如：当前显示的邮箱是 old@example.edu

  - type: textarea
    id: proposed_value
    attributes:
      label: 正确内容应该是什么
      description: 写出你确认的正确内容；不确定时只说明你知道的情况，不要猜。
      placeholder: 例如：新邮箱是 new@example.edu；老师已退休；这条与另一位老师重复。
    validations:
      required: true

  - type: input
    id: evidence_url
    attributes:
      label: 可以证明的高校官网页面
      description: 填写能看到正确内容或最新状态的学校、学院或老师主页。
      placeholder: https://example.edu/faculty/zhangwei
    validations:
      required: true

  - type: textarea
    id: explanation
    attributes:
      label: 补充说明
      description: 用一两句话说明你怎么发现问题，以及网页中的哪部分可以证明。
      placeholder: 例如：学院的新教师名单已使用新邮箱，旧个人主页也已下线。
    validations:
      required: true

  - type: checkboxes
    id: consent
    attributes:
      label: 反馈确认
      options:
        - label: 我确认反馈来自真实的高校官网信息，并理解维护者会先核对；我同意将我有权许可的反馈内容按 [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) 共享。
          required: true
